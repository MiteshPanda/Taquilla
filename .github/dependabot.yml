version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports only TypeScript below 6.1, so this pin moves when it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The base images in the three Dockerfiles (WP 8.2). CI builds every image, so an update that
  # breaks one fails its pull request.
  - package-ecosystem: docker
    directories:
      - /api
      - /payments-mock
      - /web
    schedule:
      interval: weekly
