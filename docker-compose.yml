# Services are added as they are built: api, payments-mock, sweeper, web.
services:
  postgres:
    image: postgres:16
    environment:
      # Local development only; these match DATABASE_URL in .env.example.
      POSTGRES_USER: taquilla
      POSTGRES_PASSWORD: taquilla
      POSTGRES_DB: taquilla
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # Over TCP: during first-time init the temporary server only answers on its socket,
      # so this stays unhealthy until init has finished and the real server is up.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'taquilla', '-d', 'taquilla']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
