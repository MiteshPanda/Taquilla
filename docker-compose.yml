# Services are added as they are built: api, payments-mock, sweeper, web.
services:
  postgres:
    image: postgres:16
    environment:
      # Local development only; these match DATABASE_URL in .env.example.
      POSTGRES_USER: taquilla
      POSTGRES_PASSWORD: taquilla
      POSTGRES_DB: taquilla
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # Over TCP: during first-time init the temporary server only answers on its socket,
      # so this stays unhealthy until init has finished and the real server is up.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'taquilla', '-d', 'taquilla']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Frees lapsed holds every SWEEP_INTERVAL_SECONDS (FR-EXP-3). Until WP 8.1 builds real images,
  # it runs the source on the stock Node image. Its Linux dependencies go into its own volumes,
  # so the host's node_modules is never touched.
  sweeper:
    image: node:26-slim
    working_dir: /app
    # exec makes Node process 1, so `docker compose stop` reaches it as SIGTERM and it stops cleanly.
    command: >-
      sh -c "npm ci --ignore-scripts --no-audit --no-fund
      && exec node --import tsx api/src/jobs/sweeper-cli.ts"
    environment:
      DATABASE_URL: postgres://taquilla:taquilla@postgres:5432/taquilla
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - .:/app
      - sweeper-node-modules:/app/node_modules
      - sweeper-api-node-modules:/app/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The fake payment provider (FR-MOCK-1). Like the sweeper, it runs the source on the stock Node
  # image until WP 8.1, and creates its own payments schema before it starts serving.
  payments-mock:
    image: node:26-slim
    working_dir: /app
    command: >-
      sh -c "npm ci --ignore-scripts --no-audit --no-fund
      && node --import tsx payments-mock/src/migrate-cli.ts
      && exec node --import tsx payments-mock/src/server.ts"
    environment:
      DATABASE_URL: postgres://taquilla:taquilla@postgres:5432/taquilla
      DECLINE_RATE: ${DECLINE_RATE:-0.05}
      LOST_RESPONSE_RATE: ${LOST_RESPONSE_RATE:-0.02}
      LATENCY_MIN_MS: ${LATENCY_MIN_MS:-100}
      LATENCY_MAX_MS: ${LATENCY_MAX_MS:-800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - .:/app
      - payments-node-modules:/app/node_modules
      - payments-api-node-modules:/app/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  sweeper-node-modules:
  sweeper-api-node-modules:
  payments-node-modules:
  payments-api-node-modules:
