# The web page's server in its image (WP 8.1). web/Dockerfile puts the API's origin in place of
# __API_ORIGIN__ when it builds the image.
server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Every response gets these, and a location's own headers add to them instead of replacing them.
    add_header_inherit merge;
    # The page runs only its own scripts and styles, and talks only to itself and the API. A
    # script injected some other way can't run, which matters because the login token sits in
    # sessionStorage, where any script on the page could read it (ADR 5).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Vite puts a hash of each file's content in its name, so these never change: cache them for a
    # year. Without `always`, a 404 isn't cached, so an asset that appears later is still found.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current assets, so the browser checks for a new one every time.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
